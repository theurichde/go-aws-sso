name: Build & Test

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.goreleaser.yml'
      - '.github/workflows/build-and-test.yaml'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Set up Python
        if: runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install botocore
        if: runner.os == 'Windows'
        shell: bash
        run: |
          botocore_python="$(command -v python3 || command -v python)"
          "$botocore_python" -m pip install botocore==1.44.3
          "$botocore_python" -c "from botocore.compat import _windows_shell_split"

      - name: Go vet
        run: >-
          go vet ./... &&
          go vet github.com/theurichde/go-aws-sso/internal

      - name: Tests
        run: >-
          go clean -r -testcache &&
          go clean -r -x -modcache &&
          go clean -r -x -testcache &&
          go clean -r -x -cache &&
          go test -v ./... &&
          go test -v github.com/theurichde/go-aws-sso/internal

  validate-goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check
